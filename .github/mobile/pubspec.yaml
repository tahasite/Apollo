name: apollo
description: Professional video editing and publishing tool
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  dio: ^5.7.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  image: ^4.2.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  crypto: ^3.0.5
  photo_view: ^0.15.0
  video_compress: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/